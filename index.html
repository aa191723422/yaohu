<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yukine Archive</title>
<style>
:root{--ink:#43506b;--muted:#8190aa;--line:#dce9f3;--blue:#73add8;--lav:#b9a7de;--paper:#f8fbff}*{box-sizing:border-box}body{margin:0;font-family:Arial,'Microsoft YaHei',sans-serif;color:var(--ink);background:linear-gradient(180deg,#f9fcff,#f7f2fb)}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.top{position:sticky;top:0;z-index:5;display:flex;gap:18px;align-items:center;padding:14px max(16px,calc((100vw - 1180px)/2));background:rgba(255,255,255,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.brand{font-weight:900}.brand b{display:inline-grid;place-items:center;width:36px;height:36px;margin-right:8px;color:white;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--lav))}.nav{display:flex;gap:12px;flex:1}.nav button,.ghost{border:1px solid var(--line);border-radius:999px;background:white;color:var(--muted);padding:8px 12px}.nav button.active{color:white;background:linear-gradient(135deg,var(--blue),var(--lav));border-color:transparent}.primary{border:0;border-radius:12px;padding:10px 15px;color:white;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--lav));box-shadow:0 8px 20px #9bbbd733}.wrap{max-width:1180px;margin:auto;padding:18px}.notice{padding:14px 16px;border:1px solid #f0d4e4;border-radius:18px;background:#fff7fb;margin-bottom:18px}.hero{position:relative;overflow:hidden;min-height:360px;border:1px solid var(--line);border-radius:28px;padding:48px;background:linear-gradient(130deg,#fff,#eaf7ff 55%,#f4eafd);box-shadow:0 20px 50px #7da6c422}.hero h1{font-size:clamp(38px,6vw,68px);line-height:1.05;margin:0 0 14px}.hero em{display:block;color:#75acd7;font-style:normal}.hero p{max-width:620px;color:var(--muted);line-height:1.8}.stats{display:flex;gap:24px;flex-wrap:wrap;margin-top:22px}.stats strong{display:block;font-size:24px;color:#667da1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 0}.card,.panel{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.9);box-shadow:0 8px 24px #7da6c414;overflow:hidden}.card .cover{height:180px;background:linear-gradient(135deg,#18345b,#8db9e4);display:flex;align-items:end;padding:16px;color:white;font-weight:900;font-size:22px}.card:nth-child(2) .cover{background:linear-gradient(135deg,#dfefff,#c9b8e8);color:#51617c}.card:nth-child(3) .cover{background:linear-gradient(135deg,#32233e,#eea06f)}.body{padding:15px}.body h3{margin:0 0 8px}.body p{color:var(--muted);line-height:1.6;font-size:14px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tags span{padding:4px 7px;border-radius:8px;background:#eef6fb;color:#6684a4;font-size:12px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.bar input{flex:1;min-width:220px;padding:11px 13px;border:1px solid var(--line);border-radius:12px}.panel{padding:18px}.post{border-top:1px solid var(--line);padding:12px 0}.post:first-child{border-top:0}.modalBack{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:#43506b88}.modal{position:relative;width:min(860px,100%);max-height:92vh;overflow:auto;border-radius:22px;background:white}.modal .x{position:absolute;right:12px;top:12px}.modalBody{padding:26px}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.info div{padding:12px;border:1px solid var(--line);border-radius:12px}.download{padding:14px;border-radius:14px;color:white;background:linear-gradient(135deg,#75a7d2,#a896d4);margin-top:12px}.form{display:grid;gap:10px}.form input,.form textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px}.row{display:flex;gap:8px;flex-wrap:wrap}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#43506b;color:white;padding:10px 14px;border-radius:999px}@media(max-width:800px){.top{flex-wrap:wrap}.nav{order:3;overflow:auto}.grid,.info{grid-template-columns:1fr}.hero{padding:28px}.hero h1{font-size:38px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><b>Y</b>Yukine Archive</div><nav class="nav" id="nav"></nav><button class="ghost hidden" id="adminBtn">Admin</button><button class="primary" id="authBtn">Login</button></header>
<main class="wrap"><div class="notice" id="notice"></div><section id="view"></section></main><div id="modalBack" class="modalBack hidden"><div class="modal"><button class="ghost x" onclick="closeModal()">x</button><div class="modalBody" id="modalBody"></div></div></div><div id="toast" class="toast hidden"></div>
<script>
const pages=[['home','Home'],['resources','Resources'],['dlsite','DLsite'],['forum','Forum'],['notice','Notice'],['rank','Ranking']];
const seed={resources:[{id:1,title:'Star Sea Echo: Lost Route',rj:'RJ00000001',type:'RPG',maker:'Yukine Studio',tags:['PC','Story','Chinese'],date:'2026-06-04',desc:'A sample resource connected to DLsite by RJ code.',size:'8.6 GB',downloads:3280,original:{version:'v1.4.2',password:'yukine',baidu:'https://pan.baidu.com/',baiduCode:'7k2m',quark:'https://pan.quark.cn/',quarkCode:'YN26'},cn:{version:'v1.4.2-CN',password:'yukine-cn',baidu:'https://pan.baidu.com/',baiduCode:'cn2m',quark:'https://pan.quark.cn/',quarkCode:'YNCN'},comments:[{user:'demo',text:'The final chapter has a great mood.',time:'1 hour ago'}]},{id:2,title:'Camellia Train and Rain Letter',rj:'',type:'Visual Novel',maker:'Rain Letter',tags:['PC','Healing','Short'],date:'2026-06-03',desc:'A short visual novel sample entry.',size:'2.1 GB',downloads:2710,original:{version:'Build 0612',password:'camellia',baidu:'https://pan.baidu.com/',baiduCode:'4y8p',quark:'https://pan.quark.cn/',quarkCode:'RAIN'},cn:{version:'Build 0612-YE',password:'leaf',baidu:'https://pan.baidu.com/',baiduCode:'leaf',quark:'https://pan.quark.cn/',quarkCode:'LEAF'},comments:[]},{id:3,title:'Ember Protocol',rj:'',type:'Strategy',maker:'Border Works',tags:['PC','Sci-Fi','Tactics'],date:'2026-05-31',desc:'A strategy simulation sample entry.',size:'12.4 GB',downloads:4960,original:{version:'v2.0',password:'ember',baidu:'https://pan.baidu.com/',baiduCode:'m3f9',quark:'https://pan.quark.cn/',quarkCode:'EMBR'},comments:[]}],dl:[{rj:'RJ01636060',title:'Dream Corridor',type:'Adventure',maker:'Shinshi Works',price:880,request:4},{rj:'RJ01632235',title:'Collector Sample',type:'Simulation',maker:'Serenade',price:539,request:2},{rj:'RJ00000001',title:'Star Sea Echo: Lost Route',type:'RPG',maker:'Yukine Studio',price:1280,request:0}],posts:[{id:1,title:'Forum rules',author:'official',content:'Discuss resource experience, patches and runtime issues. Do not post sensitive direct links.',date:'2026-06-05',replies:[]}],notices:[{title:'Use 7-Zip or Bandizip',content:'Download links are only visible after member login.',pinned:true}],users:[{name:'admin',password:'admin123',admin:true,points:120,checkin:''}],user:''};
let state=JSON.parse(localStorage.archive||'null')||seed;let page=location.hash.slice(1)||'home';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){localStorage.archive=JSON.stringify(state)}function me(){return state.users.find(u=>u.name===state.user)}function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),1800)}function modal(h){$('#modalBody').innerHTML=h;$('#modalBack').classList.remove('hidden')}function closeModal(){$('#modalBack').classList.add('hidden')}window.closeModal=closeModal;
function render(){document.title='Yukine Archive';$('#nav').innerHTML=pages.map(p=>`<button class="${page===p[0]?'active':''}" onclick="go('${p[0]}')">${p[1]}</button>`).join('');$('#notice').innerHTML='<b>Notice</b> '+esc(state.notices[0].title)+' - '+esc(state.notices[0].content);$('#authBtn').textContent=me()?me().name+' / Logout':'Login';$('#adminBtn').classList.toggle('hidden',!me()?.admin);({home,resources,dlsite,forum,notice,rank}[page]||home)()}function go(p){page=p;location.hash=p;render()}window.go=go;window.onhashchange=()=>{page=location.hash.slice(1)||'home';render()};
function home(){let comments=state.resources.flatMap(r=>r.comments||[]);$('#view').innerHTML=`<section class="hero"><h1>Yukine Archive<em>Resources and community.</em></h1><p>Static GitHub Pages build. Member downloads require login. Admin can publish sample resources locally.</p><div class="stats"><span><strong>${state.resources.length}</strong>resources</span><span><strong>${me()?.points||0}</strong>points</span><span><strong>${state.dl.reduce((a,b)=>a+(b.request||0),0)}</strong>requests</span><span><strong>${comments.length}</strong>comments</span></div></section><div class="grid">${state.resources.slice(0,3).map(card).join('')}</div>`}
function card(r){return `<article class="card"><div class="cover">${esc(r.title)}</div><div class="body"><h3>${esc(r.title)}</h3><p>${esc(r.desc)}</p><div class="tags">${(r.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div><p>${esc(r.type)} · ${r.downloads} downloads</p><button class="primary" onclick="detail(${r.id})">Details</button></div></article>`}
function resources(){let q='';$('#view').innerHTML=`<div class="bar"><input id="q" placeholder="Search resources"><button class="primary" onclick="publish()">Publish</button></div><div id="list" class="grid"></div>`;$('#q').oninput=e=>{q=e.target.value.toLowerCase();draw()};function draw(){let arr=state.resources.filter(r=>(r.title+r.type+r.maker+(r.tags||[]).join('')).toLowerCase().includes(q));$('#list').innerHTML=arr.map(card).join('')||'<div class="panel">No results.</div>'}draw()}
function dlsite(){$('#view').innerHTML=`<div class="grid">${state.dl.map(d=>{let linked=state.resources.find(r=>r.rj===d.rj);return `<article class="card"><div class="cover">${esc(d.rj)}</div><div class="body"><h3>${esc(d.title)}</h3><p>${esc(d.type)} · ${esc(d.maker)} · ¥${d.price}</p>${linked?`<button class="primary" onclick="detail(${linked.id})">Open resource</button>`:`<button class="ghost" onclick="request('${d.rj}')">Request (${d.request||0})</button>`}<a class="ghost" target="_blank" href="https://www.dlsite.com/maniax/work/=/product_id/${d.rj}.html">DLsite</a></div></article>`}).join('')}</div>`}
function forum(){$('#view').innerHTML=`<div class="panel"><button class="primary" onclick="newPost()">New post</button>${state.posts.slice().reverse().map(p=>`<div class="post"><h3>${esc(p.title)}</h3><p>${esc(p.content)}</p><small>${esc(p.author)} · ${p.date}</small>${(p.replies||[]).map(r=>`<p><b>${esc(r.user)}</b>: ${esc(r.text)}</p>`).join('')}<form onsubmit="reply(event,${p.id})"><input name="text" placeholder="Reply"><button class="ghost">Send</button></form></div>`).join('')}</div>`}
function notice(){$('#view').innerHTML=`<div class="panel">${state.notices.map(n=>`<div class="post"><h3>${esc(n.title)}</h3><p>${esc(n.content)}</p></div>`).join('')}</div>`}function rank(){$('#view').innerHTML=`<div class="grid"><div class="panel"><h3>Downloads</h3>${state.resources.map(r=>`<p>${esc(r.title)} - ${r.downloads}</p>`).join('')}</div><div class="panel"><h3>Requests</h3>${state.dl.map(d=>`<p>${esc(d.title)} - ${d.request||0}</p>`).join('')}</div><div class="panel"><h3>Comments</h3>${state.resources.map(r=>`<p>${esc(r.title)} - ${(r.comments||[]).length}</p>`).join('')}</div></div>`}
window.detail=id=>{let r=state.resources.find(x=>x.id===id);modal(`<h2>${esc(r.title)}</h2><p>${esc(r.desc)}</p><div class="info"><div><small>Type</small><b>${esc(r.type)}</b></div><div><small>Original</small><b>${esc(r.original?.version||'-')}</b></div><div><small>Chinese</small><b>${esc(r.cn?.version||'None')}</b></div></div><div class="row"><button class="primary" onclick="download(${id},'original')">Original resource</button><button class="ghost" onclick="download(${id},'cn')">Chinese resource</button></div><div id="down"></div><h3>Comments</h3><form onsubmit="comment(event,${id})" class="form"><input name="text" placeholder="Comment after login"><button class="primary">Send</button></form>${(r.comments||[]).map(c=>`<p><b>${esc(c.user)}</b>: ${esc(c.text)} <small>${esc(c.time)}</small></p>`).join('')}`)};
window.download=(id,k)=>{if(!me())return auth();let r=state.resources.find(x=>x.id===id),p=k==='cn'?r.cn:r.original;if(!p)return toast('No pack');r.downloads++;save();$('#down').innerHTML=`<div class="download"><b>${esc(p.version)}</b><p>Password: ${esc(p.password||'none')}</p><p>Baidu: ${esc(p.baiduCode||'')} <a href="${esc(p.baidu||'#')}" target="_blank">open</a></p><p>Quark: ${esc(p.quarkCode||'')} <a href="${esc(p.quark||'#')}" target="_blank">open</a></p></div>`};
window.comment=(e,id)=>{e.preventDefault();if(!me())return auth();let t=e.target.text.value.trim();if(!t)return;state.resources.find(r=>r.id===id).comments.push({user:me().name,text:t,time:'now'});me().points+=2;save();detail(id);toast('Saved locally. Repo sync needs a server-side GitHub token.')};
function auth(){modal(`<h2>Login / Register</h2><form class="form" onsubmit="login(event)"><input name="name" placeholder="username" required><input name="password" type="password" placeholder="password" required><div class="row"><button class="primary" name="mode" value="login">Login</button><button class="ghost" name="mode" value="register">Register</button></div><p>Admin: admin / admin123</p></form>`)}$('#authBtn').onclick=()=>{if(me()){state.user='';save();render()}else auth()};window.login=e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name'),pass=f.get('password'),u=state.users.find(x=>x.name===name);if(e.submitter.value==='register'){if(u)return toast('User exists');u={name,password:pass,points:20,checkin:''};state.users.push(u)}if(!u||u.password!==pass)return toast('Wrong password');state.user=name;save();closeModal();render()};
function publish(){if(!me()?.admin)return auth();modal(`<h2>Publish resource</h2><form class="form" onsubmit="doPublish(event)"><input name="title" placeholder="title" required><input name="rj" placeholder="RJ code"><input name="type" placeholder="type"><textarea name="desc" placeholder="description"></textarea><button class="primary">Publish</button></form>`)}window.publish=publish;window.doPublish=e=>{e.preventDefault();let f=new FormData(e.target);state.resources.unshift({id:Date.now(),title:f.get('title'),rj:f.get('rj'),type:f.get('type')||'Game',maker:'admin',tags:['PC'],date:new Date().toISOString().slice(0,10),desc:f.get('desc'),size:'unknown',downloads:0,original:{version:'v1.0'},comments:[]});save();closeModal();go('resources')};
window.request=rj=>{if(!me())return auth();let d=state.dl.find(x=>x.rj===rj);d.request=(d.request||0)+1;save();render()};window.newPost=()=>{if(!me())return auth();modal(`<h2>New post</h2><form class="form" onsubmit="post(event)"><input name="title" placeholder="title"><textarea name="content" placeholder="content"></textarea><button class="primary">Post</button></form>`)};window.post=e=>{e.preventDefault();let f=new FormData(e.target);state.posts.push({id:Date.now(),title:f.get('title'),content:f.get('content'),author:me().name,date:new Date().toISOString().slice(0,10),replies:[]});save();closeModal();go('forum')};window.reply=(e,id)=>{e.preventDefault();if(!me())return auth();let t=e.target.text.value.trim();if(!t)return;state.posts.find(p=>p.id===id).replies.push({user:me().name,text:t});save();forum()};$('#adminBtn').onclick=()=>modal('<h2>Admin</h2><p>Static build is running on GitHub Pages.</p><p>For automatic repository comment sync, run the Node/Worker backend with a server-side GitHub token.</p>');render();
</script>
</body>
</html>
